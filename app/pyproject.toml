[project]
name="plan-kept"
version="0.1.0"
description="Privacy-aware collaborative partner for support-plan implementation gaps"
requires-python=">=3.12"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.32","pydantic>=2.9","google-cloud-firestore>=2.19","google-genai>=1.0"]
[project.optional-dependencies]
dev=["pytest>=8.3","httpx>=0.27","ruff>=0.7"]
[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
where=["."]
include=["plan_kept*","service*"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts=["-p","no:asyncio"]
[tool.ruff]
line-length=100
target-version="py312"

