<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">Plan Kept architecture</title><desc id="d">Separate participant perspectives flow through privacy projection and a stateful Google Cloud partner to qualified human repair and student confirmation.</desc><rect width="1400" height="650" fill="#17111b"/><style>.h{font:700 30px Arial;fill:#fbf3ff}.s{font:600 15px Arial;fill:#c6a8ff}.b{font:600 18px Arial;fill:#fbf3ff}.n{font:14px Arial;fill:#baa9c2}.box{fill:#241b29;stroke:#5d4868;stroke-width:2}.g{fill:#2d2240;stroke:#a887f1;stroke-width:2}.human{fill:#1d352e;stroke:#72d4b7;stroke-width:2}.a{stroke:#b99af6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b99af6"/></marker></defs><text x="55" y="58" class="h">Plan Kept — privacy-aware collaboration</text><text x="55" y="88" class="n">Existing fictional plan · bounded memory · qualified human authority</text><rect class="box" x="55" y="135" rx="18" width="300" height="330"/><text class="s" x="80" y="172">SEPARATE INPUTS</text><text class="b" x="80" y="215">Synthetic support plan</text><text class="n" x="80" y="241">Gemini exact-quote reader</text><text class="b" x="80" y="292">Student · family · staff</text><text class="n" x="80" y="318">One question at a time</text><text class="n" x="80" y="344">private · facilitator · team</text><text class="b" x="80" y="395">Revision control</text><text class="n" x="80" y="421">Previous answer and reason retained</text><path class="a" d="M355 300H445"/><rect class="g" x="445" y="115" rx="18" width="455" height="370"/><text class="s" x="475" y="153">GOOGLE CLOUD PARTNER</text><text class="b" x="475" y="198">Cloud Run · FastAPI state machine</text><text class="n" x="475" y="225">Role projection · sharing filter · ordered workflow</text><text class="b" x="475" y="278">Vertex AI · Gemini 3.5 Flash + Embedding 001</text><text class="n" x="475" y="305">Restricted schema · verbatim quote verification</text><text class="b" x="475" y="358">Promise-to-reality ledger</text><text class="n" x="475" y="385">agreement · conflict · unknown · no truth score</text><text class="b" x="475" y="435">Firestore-compatible memory</text><text class="n" x="475" y="462">Preferences · evidence · decisions · actions</text><path class="a" d="M900 300H990"/><rect class="human" x="990" y="135" rx="18" width="355" height="160"/><text class="s" x="1018" y="173">QUALIFIED HUMAN</text><text class="b" x="1018" y="215">Finding and repair authority</text><text class="n" x="1018" y="243">Clarify · decide · approve owned actions</text><path class="a" d="M1168 295V380"/><rect class="box" x="990" y="380" rx="18" width="355" height="145"/><text class="s" x="1018" y="417">RETURN PATH</text><text class="b" x="1018" y="458">Student confirmation</text><text class="n" x="1018" y="486">Lived availability closes the repair loop</text><rect x="445" y="535" width="455" height="65" rx="15" fill="#392041" stroke="#d48bb1"/><text class="b" x="475" y="564">Code-enforced zeroes</text><text class="n" x="475" y="587">private leaks · truth scores · automatic plan changes</text></svg>
